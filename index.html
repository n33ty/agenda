<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agenda">
<meta name="theme-color" content="#5b7fae">
<title>Agenda d’Abdo</title>
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #f3f5fa; --surface: #ffffff; --text: #1b2232; --muted: #6a7488; --line: #e3e8f0; --today: #fff7da; --warn: #d33f33;
  --cours: #5b7fae; --etude: #3f9e72; --argent: #c58b17; --sport: #d2506b;
  --g-sleep: linear-gradient(90deg, #5b5bd6, #a78bfa);
  --g-etude: linear-gradient(90deg, #2e9b6a, #7ee0a8);
  --g-sport: linear-gradient(90deg, #e0516b, #ff9d8a);
  --g-argent: linear-gradient(90deg, #d99a1c, #ffd66b);
  --g-xp: linear-gradient(90deg, #f0a21c, #ffe08a);
  --shadow: 0 1px 2px rgba(20,30,50,.06), 0 6px 18px rgba(20,30,50,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #11141b; --surface: #1b202b; --text: #e9edf6; --muted: #98a2b6; --line: #2b3242; --today: #2b2a1c;
    --cours: #4a6a96; --etude: #35865f; --argent: #a8741a; --sport: #b44660; --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #11141b; --surface: #1b202b; --text: #e9edf6; --muted: #98a2b6; --line: #2b3242; --today: #2b2a1c;
  --cours: #4a6a96; --etude: #35865f; --argent: #a8741a; --sport: #b44660; --shadow: none;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; max-width: 1100px; margin-inline: auto; }
button { font-family: inherit; color: inherit; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
h1 { font-size: 22px; margin: 0; }
#sync { font-size: 12px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; white-space: nowrap; }
.card { background: var(--surface); border-radius: 18px; padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow); border: 1px solid var(--line); }

/* XP */
.lvl { font-size: 16px; font-weight: 700; }
.lvl span { font-weight: 400; color: var(--muted); font-size: 13px; }
.tmsg { color: var(--muted); font-size: 12px; margin-top: 6px; }
.reward { width: 100%; margin-top: 10px; padding: 10px 12px; font-size: 14px; border: 1px dashed var(--line); border-radius: 12px; background: transparent; color: var(--text); }

/* Barres */
.pbar { position: relative; height: 16px; background: var(--line); border-radius: 999px; overflow: hidden; }
.pbar i { display: block; height: 100%; width: 0; border-radius: 999px; transition: width .8s cubic-bezier(.22, 1, .36, 1); box-shadow: inset 0 -2px 0 rgba(0,0,0,.08), inset 0 2px 0 rgba(255,255,255,.28); }
.g-sleep { background: var(--g-sleep); } .g-etude { background: var(--g-etude); } .g-sport { background: var(--g-sport); } .g-argent { background: var(--g-argent); } .g-xp { background: var(--g-xp); }
.xpcard .pbar { margin-top: 10px; height: 12px; }

/* Semaine */
.weeknav { display: grid; grid-template-columns: 52px 1fr 52px; gap: 10px; align-items: center; margin-bottom: 14px; }
.weeknav button { height: 52px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); font-size: 26px; cursor: pointer; box-shadow: var(--shadow); }
.weeknav button:disabled { opacity: .35; cursor: default; }
.weeknav button:active { transform: scale(.96); }
.weeklabel { text-align: center; }
.weeklabel b { display: block; font-size: 20px; }
.weeklabel span { color: var(--muted); font-size: 13px; }

/* Objectifs */
.obj { margin-bottom: 16px; }
.obj:last-of-type { margin-bottom: 0; }
.objhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 7px; }
.objname { font-weight: 650; font-size: 15px; }
.objval { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.objval b { color: var(--text); }
.edit { border: none; background: transparent; color: var(--muted); font-size: 14px; cursor: pointer; padding: 2px 6px; border-radius: 8px; }
.sub { font-size: 12px; color: var(--muted); margin-top: 5px; }

/* Boutons d’ajout */
.actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
.big { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 60px; padding: 12px 14px; border: none; border-radius: 16px; font-size: 15px; font-weight: 650; color: #fff; cursor: pointer; box-shadow: var(--shadow); text-align: left; transition: transform .1s; }
.big:active { transform: scale(.97); }
.big .ic { font-size: 22px; line-height: 1; }
.big.argent { background: var(--g-argent); color: #3a2a00; }
.big.etude { background: var(--g-etude); color: #06301c; }
.big.sport { background: var(--g-sport); color: #4a0b19; }
.addblock { width: 100%; min-height: 54px; margin-bottom: 12px; border-radius: 16px; border: 2px dashed var(--line); background: var(--surface); font-size: 15px; font-weight: 650; cursor: pointer; }
.addblock:active { transform: scale(.98); }

/* Agenda */
.wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 14px; box-shadow: var(--shadow); }
.cal { min-width: 720px; display: grid; grid-template-columns: 46px repeat(7, 1fr); }
.head { font-weight: 600; font-size: 13px; text-align: center; padding: 8px 2px; border-bottom: 1px solid var(--line); background: var(--surface); }
.head.today { background: var(--today); }
.head small { display: block; color: var(--muted); font-weight: 400; }
.times { position: relative; height: 640px; }
.times span { position: absolute; right: 6px; font-size: 11px; color: var(--muted); transform: translateY(-6px); }
.col { position: relative; height: 640px; border-left: 1px solid var(--line); background-image: linear-gradient(to bottom, var(--line) 1px, transparent 1px); background-size: 100% 40px; }
.col.today { background-color: var(--today); }
.ev { position: absolute; border-radius: 8px; padding: 3px 5px; font-size: 11px; line-height: 1.25; color: #fff; overflow: hidden; border: 1px solid rgba(0,0,0,.12); cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.ev b { display: block; font-size: 11px; padding-right: 22px; }
.ev.cours { background: var(--cours); } .ev.etude { background: var(--etude); } .ev.argent { background: var(--argent); } .ev.sport { background: var(--sport); }
.ev.over { outline: 2px solid var(--warn); outline-offset: -2px; }
.ev.done { opacity: .55; }
.chk { position: absolute; top: 2px; right: 2px; width: 24px; height: 24px; padding: 0; border: 1.5px solid rgba(255,255,255,.95); border-radius: 7px; background: rgba(255,255,255,.12); color: #222; font-size: 14px; line-height: 1; font-weight: 800; cursor: pointer; touch-action: manipulation; }
.ev.done .chk { background: #fff; }
.scell { padding: 4px 3px; border-left: 1px solid var(--line); background: var(--surface); }
.scell.first { border-left: none; }
.scell.today { background: var(--today); }
.srow-top { border-bottom: 1px solid var(--line); }
.srow-bottom { border-top: 1px solid var(--line); }
.sl { display: block; width: 100%; min-height: 38px; padding: 4px 3px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--muted); font-size: 11px; font-weight: 650; line-height: 1.2; cursor: pointer; text-align: center; touch-action: manipulation; }
.sl.on { background: linear-gradient(90deg, #5b5bd6, #a78bfa); border-color: #6a63e0; color: #fff; }

/* Avatar */
.avhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
.avhead b { font-size: 16px; }
.avstatus { font-size: 12px; font-weight: 650; padding: 4px 10px; border-radius: 999px; background: var(--bg); color: var(--muted); }
.avstage { border-radius: 14px; overflow: hidden; line-height: 0; border: 1px solid #1f4a58; }
.avbadges { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.avbadge { background: var(--bg); border-radius: 999px; padding: 6px 11px; font-size: 13px; font-weight: 650; }
.avbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.big.alt { background: var(--bg); color: var(--text); box-shadow: none; border: 1px solid var(--line); }
.sheet.wide { max-width: 600px; }
.wgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.wcard { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--bg); cursor: pointer; padding: 0; text-align: left; }
.wcard.sel { border-color: #3b6fd8; box-shadow: 0 0 0 2px rgba(59,111,216,.35); }
.wcard .wt { padding: 8px 10px 10px; font-size: 12px; color: var(--muted); }
.wcard .wt b { display: block; color: var(--text); font-size: 14px; }
.wcard .wst { margin-top: 5px; line-height: 1.5; }
.avprev { border-radius: 14px; overflow: hidden; line-height: 0; margin-bottom: 6px; border: 1px solid #1f4a58; }
.seg { display: flex; gap: 6px; margin-bottom: 10px; }
.seg button { flex: 1; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 13px; cursor: pointer; }
.seg button.sel { background: #3b6fd8; border-color: #3b6fd8; color: #fff; }
.sw-row { display: flex; gap: 8px; flex-wrap: wrap; }
.sw { width: 36px; height: 36px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 1.5px var(--line); cursor: pointer; padding: 0; }
.sw.sel { box-shadow: 0 0 0 3px #3b6fd8; }
.opt { height: 38px; padding: 0 14px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); font-size: 14px; cursor: pointer; }
.opt.sel { background: #3b6fd8; border-color: #3b6fd8; color: #fff; }
.avstage canvas, .avprev canvas, .wcard canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; image-rendering: crisp-edges; }
.avstage, .avprev { background: #07141b; }
.wcard { background: #07141b; }
.wcard .wt { background: var(--bg); }

/* Historique */
.hrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.hrow:last-child { border-bottom: none; }
.hrow small { color: var(--muted); display: block; font-size: 12px; }
.hdel { border: none; background: var(--bg); width: 34px; height: 34px; border-radius: 10px; font-size: 15px; cursor: pointer; flex: none; }

/* Fenêtres */
.modal { position: fixed; inset: 0; background: rgba(10,14,22,.55); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
.modal[hidden] { display: none; }
.sheet { background: var(--surface); width: 100%; max-width: 480px; border-radius: 22px 22px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom, 0px)); max-height: 92vh; overflow: auto; }
@media (min-width: 600px) { .modal { align-items: center; } .sheet { border-radius: 22px; } }
.sheet h2 { font-size: 18px; margin: 0 0 14px; display: flex; justify-content: space-between; align-items: center; }
.x { border: none; background: var(--bg); width: 36px; height: 36px; border-radius: 12px; font-size: 18px; cursor: pointer; }
.sheet label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 5px; }
.sheet input, .sheet select { width: 100%; height: 48px; padding: 0 12px; font-size: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--text); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.types { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tbtn { height: 56px; border-radius: 14px; border: 2px solid var(--line); background: var(--bg); font-size: 14px; font-weight: 650; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.tbtn.sel.etude { background: var(--etude); border-color: var(--etude); color: #fff; }
.tbtn.sel.argent { background: var(--argent); border-color: var(--argent); color: #fff; }
.tbtn.sel.sport { background: var(--sport); border-color: var(--sport); color: #fff; }
.chips { display: flex; gap: 8px; margin-top: 8px; }
.chip { flex: 1; height: 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); font-size: 14px; cursor: pointer; }
.net { margin-top: 14px; padding: 12px 14px; border-radius: 14px; background: var(--bg); font-size: 15px; display: flex; justify-content: space-between; }
.net b { font-size: 17px; }
.btns { display: flex; gap: 10px; margin-top: 18px; }
.btn { flex: 1; height: 52px; border-radius: 14px; border: none; font-size: 16px; font-weight: 650; cursor: pointer; background: var(--bg); }
.btn.primary { background: #3b6fd8; color: #fff; }
.btn.danger { background: #fde8e6; color: #b3261e; }
.err { color: var(--warn); font-size: 13px; margin-top: 10px; min-height: 16px; }

@media (max-width: 640px) {
  .actions { grid-template-columns: 1fr; }
  .big { justify-content: flex-start; }
}
</style>
</head>
<body>
<div class="top"><h1>Agenda d’Abdo</h1><div id="sync">Connexion…</div></div>

<div class="card xpcard">
  <div class="lvl" id="xp-lvl"></div>
  <div class="pbar"><i id="xp-bar" class="g-xp"></i></div>
  <div class="tmsg" id="xp-msg"></div>
  <input class="reward" id="in-reward" type="text" maxlength="60" placeholder="🎁 Ma récompense au prochain niveau" aria-label="Récompense au prochain niveau">
</div>

<div class="weeknav">
  <button id="prev" aria-label="Semaine précédente">‹</button>
  <div class="weeklabel"><b id="wk-title"></b><span id="wk-range"></span></div>
  <button id="next" aria-label="Semaine suivante">›</button>
</div>

<div class="card">
  <div class="avhead"><b id="av-title"></b><span class="avstatus" id="av-status"></span></div>
  <div class="avstage"><canvas id="av-canvas" width="144" height="96" aria-label="Avatar pixel art animé"></canvas></div>
  <div class="avbadges" id="av-badges"></div>
  <div class="avbtns">
    <button class="big alt" id="av-custom"><span class="ic">🎨</span><span>Personnaliser</span></button>
    <button class="big alt" id="av-weeks"><span class="ic">🖼️</span><span>Mes semaines</span></button>
  </div>
</div>

<div class="card">
  <div class="obj">
    <div class="objhead"><div class="objname">🌙 Sommeil</div><div class="objval" id="val-sleep"></div></div>
    <div class="pbar"><i id="bar-sleep" class="g-sleep"></i></div>
  </div>
  <div class="obj">
    <div class="objhead"><div class="objname">📚 Étude <button class="edit" data-goal="etude" aria-label="Modifier l’objectif d’étude">✎</button></div><div class="objval" id="val-etude"></div></div>
    <div class="pbar"><i id="bar-etude" class="g-etude"></i></div>
  </div>
  <div class="obj">
    <div class="objhead"><div class="objname">🏃 Sport <button class="edit" data-goal="sport" aria-label="Modifier l’objectif de sport">✎</button></div><div class="objval" id="val-sport"></div></div>
    <div class="pbar"><i id="bar-sport" class="g-sport"></i></div>
  </div>
  <div class="obj">
    <div class="objhead"><div class="objname">💶 Argent <button class="edit" data-goal="argent" aria-label="Modifier l’objectif d’argent">✎</button></div><div class="objval" id="val-argent"></div></div>
    <div class="pbar"><i id="bar-argent" class="g-argent"></i></div>
    <div class="sub" id="sub-argent"></div>
  </div>
</div>

<div class="actions">
  <button class="big argent" id="add-gains"><span class="ic">💶</span><span>Ajouter mes gains</span></button>
  <button class="big etude" id="add-etude"><span class="ic">📚</span><span>Ajouter des heures d’étude</span></button>
  <button class="big sport" id="add-sport"><span class="ic">🏃</span><span>Ajouter des heures de sport</span></button>
</div>

<button class="addblock" id="add-block">＋ Ajouter un bloc à l’agenda</button>
<div class="wrap"><div class="cal" id="cal"></div></div>
<div class="card" id="history" hidden></div>

<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>

<script>
var START = 7, END = 23, H = 40;
var DAYS = ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
var DAYS_LONG = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
var MONTHS = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
var TYPES = {
  etude: { label: "Étude", icon: "📚" },
  argent: { label: "Argent", icon: "💶", title: "Uber Eats" },
  sport: { label: "Sport", icon: "🏃" }
};
var CHECKABLE = { etude: 1, argent: 1, sport: 1 };
var WEEK0 = new Date(2026, 9, 19);
var SLEEP_TOTAL = 14;
var LEVELS = [
  { n: "Recrue", x: 0 }, { n: "Apprenti", x: 500 }, { n: "Studieux", x: 1200 }, { n: "Discipliné", x: 2200 },
  { n: "Régulier", x: 3500 }, { n: "Expert", x: 5000 }, { n: "Maître", x: 7000 }, { n: "Légende", x: 9500 }
];
function $(id) { return document.getElementById(id); }

function E(d, s, e, type, title, sub, extra) {
  var o = { d: d, s: s, e: e, t: type, title: title, sub: sub || "" };
  if (extra) for (var k in extra) o[k] = extra[k];
  return o;
}
function S(d, s, e, course) {
  return E(d, s, e, "etude", "Étude", fmt(s) + " – " + fmt(e));
}
function build(i) {
  var ev = [], d;
  if (i !== 1) {
    // CM gardés : Management, PPS, Éthique. TP Économétrie gardé. CM GDO, Économétrie et TDO sautés.
    ev.push(E(0, 14.5, 16.5, "cours", "CM Management et stratégie"));
    ev.push(E(1, 13.5, 15.5, "cours", "TP Économétrie"));
    ev.push(E(2, 8.5, 10.5, "cours", "PPS (Public policy seminar)"));
    ev.push(E(3, 10.5, 12.5, "cours", "CM Éthique et économie"));
  }
  ev.push(E(2, 17, 18.5, "prive", "Cours particulier", "17h – 18h30"));
  if (i === 2) {
    ev.push(E(1, 16.5, 18.25, "ecole", "École de devoirs", "16h30 – 18h15"));
    ev.push(E(3, 16.5, 18.25, "ecole", "École de devoirs", "16h30 – 18h15"));
  }
  var wk = ["GDO", "Économétrie", "TDO"];
  for (d = 4; d <= 6; d++) {
    ev.push(S(d, 7.5, 10, wk[d - 4]));
    ev.push(E(d, 11, 22, "uber", "Uber Eats", "11h – 22h"));
  }
  if (i === 1) {
    ev.push(S(0, 7.5, 14, "GDO"), S(0, 14, 17, "TDO"));
    ev.push(S(1, 7.5, 12.5, "GDO"), S(1, 14, 17, "Économétrie"));
    ev.push(S(2, 7.5, 12, "Économétrie"), S(2, 12.5, 16, "Travaux de groupe"));
    ev.push(S(3, 7.5, 12.5, "GDO"), S(3, 14, 17, "Économétrie"));
    [0, 1, 3].forEach(function (x) { ev.push(E(x, 17.5, 22, "uber", "Uber Eats", "17h30 – 22h", { m: 40 })); });
    ev.push(E(2, 19, 22, "uber", "Uber Eats", "19h – 22h", { m: 25 }));
  } else {
    ev.push(S(0, 7.5, 10.5, "GDO"), S(0, 11, 14, "Économétrie"), S(0, 19.5, 21, "TDO"));
    ev.push(S(1, 7.5, 10, "GDO"), S(1, 10.5, 13, "Économétrie"), S(1, 19.5, 21, "TDO"));
    ev.push(S(2, 11, 13.5, "TDO"), S(2, 14, 16, "PPS"), S(2, 19.5, 21, "Éthique"));
    ev.push(S(3, 7.5, 10, "GDO"), S(3, 13.5, 16, "Management"), S(3, 19.5, 21, "Économétrie"));
  }
  return ev;
}

/* ===== Moteur pixel art (144 x 96) ===== */
var PW = 144, PH = 96, GY = 88;
var _cc = {};
function C(hex) {
  if (_cc[hex] !== undefined) return _cc[hex];
  var n = parseInt(hex.slice(1), 16);
  var v = ((255 << 24) | ((n & 255) << 16) | (((n >> 8) & 255) << 8) | ((n >> 16) & 255)) >>> 0;
  _cc[hex] = v; return v;
}
function mix(hex, f) {
  var n = parseInt(hex.slice(1), 16), r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  function ch(c) { return f >= 0 ? Math.round(c + (255 - c) * f) : Math.round(c * (1 + f)); }
  return "#" + ((1 << 24) | (ch(r) << 16) | (ch(g) << 8) | ch(b)).toString(16).slice(1);
}
function hash(a, b) { var h = (a * 374761393 + b * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }

}
function openBlockForm(id) {
  var blk = id ? getBlocks(cur).filter(function (x) { return x.id === id; })[0] : null;
  var type = blk ? blk.type : "etude";
  var isCours = type === "cours";
  var html = head(blk ? "Modifier le bloc" : "Nouveau bloc");
  if (!isCours) {
    html += '<label>Type</label><div class="types">' + Object.keys(TYPES).map(function (k) {
      return '<button type="button" class="tbtn ' + k + (k === type ? " sel" : "") + '" data-t="' + k + '"><span>' + TYPES[k].icon + '</span>' + TYPES[k].label + '</button>';
    }).join("") + "</div>";
  } else {
    html += '<div class="sub" style="margin:0 0 4px"></div>';
  }
  html += '<label for="f-day">Jour</label><select id="f-day">' + dayOptions(blk ? blk.day : 0) + "</select>" +
    '<div class="row2"><div><label for="f-start">Début</label><select id="f-start">' + timeOptions(7, 22.75, blk ? blk.start : 9) + "</select></div>" +
    '<div><label for="f-end">Fin</label><select id="f-end">' + timeOptions(7.25, 23, blk ? blk.end : 11) + "</select></div></div>" +
    '<div class="err" id="f-err"></div>' +
    '<div class="btns">' + (blk ? '<button class="btn danger" id="f-del">Supprimer</button>' : '<button class="btn" id="m-cancel">Annuler</button>') +
    '<button class="btn primary" id="f-save">Enregistrer</button></div>';
  openModal(html);
  bindClose();
  if (isCours) $("sheet").querySelector(".sub").textContent = blk.title;
  var sel = type;
  Array.prototype.forEach.call($("sheet").querySelectorAll(".tbtn"), function (btn) {
    btn.onclick = function () {
      sel = btn.getAttribute("data-t");
      Array.prototype.forEach.call($("sheet").querySelectorAll(".tbtn"), function (x) { x.classList.toggle("sel", x === btn); });
    };
  });
  $("f-save").onclick = function () {
    var day = parseInt($("f-day").value, 10), s = parseFloat($("f-start").value), e = parseFloat($("f-end").value);
    if (!(e > s)) { $("f-err").textContent = "L’heure de fin doit être après le début."; return; }
    var w = ensureWeek(cur);
    if (blk) {
      var b = w.blocks.filter(function (x) { return x.id === blk.id; })[0];
      if (b) {
        if (!isCours && sel !== b.type) {
          var oldDefault = b.type === "argent" ? TYPES.argent.title : TYPES[b.type].label;
          if (b.title === oldDefault) b.title = sel === "argent" ? TYPES.argent.title : TYPES[sel].label;
          b.type = sel;
        }
        b.day = day; b.start = s; b.end = e;
      }
    } else {
      w.blocks.push({ id: newId(), day: day, start: s, end: e, type: sel, title: sel === "argent" ? TYPES.argent.title : TYPES[sel].label, done: false });
    }
    persist(); closeModal(); renderAll();
  };
  if (blk) {
    var armed = false;
    $("f-del").onclick = function () {
      if (!armed) { armed = true; this.textContent = "Confirmer"; return; }
      var w = ensureWeek(cur);
      w.blocks = w.blocks.filter(function (x) { return x.id !== blk.id; });
      persist(); closeModal(); renderAll();
    };
  }
}
function openGains() {
  openModal(head("Ajouter mes gains") +
    '<label for="g-gains">Combien as-tu gagné ? (€)</label><input id="g-gains" type="number" inputmode="decimal" min="0" step="any" placeholder="0">' +
    '<label for="g-ch">Quelles sont tes charges ? Essence, etc. (€)</label><input id="g-ch" type="number" inputmode="decimal" min="0" step="any" placeholder="0">' +
    '<div class="net"><span>Bénéfice net</span><b id="g-net">0 €</b></div><div class="err" id="g-err"></div>' +
    '<div class="btns"><button class="btn" id="m-cancel">Annuler</button><button class="btn primary" id="g-save">Ajouter</button></div>');
  bindClose();
  function upd() { var n = numVal("g-gains") - numVal("g-ch"); $("g-net").textContent = fr(n) + " €"; }
  $("g-gains").oninput = upd; $("g-ch").oninput = upd;
  $("g-save").onclick = function () {
    var g = numVal("g-gains"), c = numVal("g-ch");
    if (!g && !c) { $("g-err").textContent = "Entre au moins un montant."; return; }
    ensureWeek(cur).entries.push({ id: newId(), k: "argent", gains: g, charges: c });
    persist(); closeModal(); renderAll();
  };
  $("g-gains").focus();
}
function openHours(kind) {
  var label = kind === "etude" ? "d’étude" : "de sport";
  openModal(head("Ajouter des heures " + label) +
    '<label for="h-val">Nombre d’heures</label><input id="h-val" type="number" inputmode="decimal" min="0" step="0.25" placeholder="0">' +
    '<div class="chips"><button class="chip" data-v="0.5">+ 0,5 h</button><button class="chip" data-v="1">+ 1 h</button><button class="chip" data-v="2">+ 2 h</button></div>' +
    '<div class="err" id="h-err"></div>' +
    '<div class="btns"><button class="btn" id="m-cancel">Annuler</button><button class="btn primary" id="h-save">Ajouter</button></div>');
  bindClose();
  Array.prototype.forEach.call($("sheet").querySelectorAll(".chip"), function (c) {
    c.onclick = function () { $("h-val").value = r2(numVal("h-val") + parseFloat(c.getAttribute("data-v"))); };
  });
  $("h-save").onclick = function () {
    var h = numVal("h-val");
    if (!(h > 0)) { $("h-err").textContent = "Entre un nombre d’heures."; return; }
    ensureWeek(cur).entries.push({ id: newId(), k: kind, h: h });
    persist(); closeModal(); renderAll();
  };
  $("h-val").focus();
}
function openGoal(kind) {
  var g = goalsOf(cur)[kind], unit = kind === "argent" ? "€" : "h";
  var name = kind === "etude" ? "d’étude" : kind === "sport" ? "de sport" : "d’argent";
  openModal(head("Objectif " + name) +
    '<label for="o-val">Objectif de la semaine (' + unit + ')</label><input id="o-val" type="number" inputmode="decimal" min="0" step="any" value="' + g + '">' +
    '<div class="err" id="o-err"></div>' +
    '<div class="btns"><button class="btn" id="m-cancel">Annuler</button><button class="btn primary" id="o-save">Enregistrer</button></div>');
  bindClose();
  $("o-save").onclick = function () {
    var v = numVal("o-val");
    if (!(v > 0)) { $("o-err").textContent = "Entre un objectif supérieur à 0."; return; }
    ensureWeek(cur).goals[kind] = v;
    persist(); closeModal(); renderAll();
  };
}

/* ---------- Boutons ---------- */
$("prev").onclick = function () { if (cur > 0) { cur--; renderAll(); } };
$("next").onclick = function () { cur++; renderAll(); };
$("add-block").onclick = function () { openBlockForm(null); };
$("add-gains").onclick = openGains;
$("add-etude").onclick = function () { openHours("etude"); };
$("add-sport").onclick = function () { openHours("sport"); };
Array.prototype.forEach.call(document.querySelectorAll(".edit"), function (b) {
  b.onclick = function () { openGoal(b.getAttribute("data-goal")); };
});
$("in-reward").value = state.reward || "";
$("in-reward").oninput = function () { state.reward = this.value.slice(0, 60); persist(); };

/* ---------- Avatar pixel art : affichage, personnalisation, semaines ---------- */
function getAv() { var o = {}; for (var k in PX_DEFAULT) o[k] = (state.avatar && state.avatar[k]) || PX_DEFAULT[k]; return o; }
function tiersOf(i) {
  var t = totals(i), g = goalsOf(i);
  function tr(v, goal) { var p = goal > 0 ? v / goal : 0; return p >= 1 ? 5 : Math.max(0, Math.floor(p * 5)); }
  return { argent: tr(t.net, g.argent), etude: tr(t.study, g.etude), sport: tr(t.sport, g.sport) };
}
function weekStatus(i) {
  var a = weekStart(i), b = weekStart(i + 1), n = new Date();
  return n >= b ? "Terminée" : (n < a ? "À venir" : "En cours");
}
var avReduced = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
var avTargets = [], avFrame = 0, avFlash = 0, lastTiers = null, lastTiersWeek = -1;
function avMake(el, get, still, id) {
  var ctx = el.getContext("2d"), img = ctx.createImageData(PW, PH);
  var tg = { el: el, ctx: ctx, img: img, d32: new Uint32Array(img.data.buffer), get: get, still: !!still, id: id || "" };
  avTargets.push(tg); return tg;
}
function avDrop(id) { avTargets = avTargets.filter(function (t) { return t.id !== id; }); }
function applyFlash(d32, amt) {
  for (var i = 0; i < d32.length; i++) { var c = d32[i], r = c & 255, g = (c >> 8) & 255, b = (c >> 16) & 255; r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; d32[i] = ((255 << 24) | (b << 16) | (g << 8) | r) >>> 0; }
}
function avPaint(tg, frame, flash) {
  var a = tg.get();
  renderFrame(tg.d32, frame, a.o, a.tr, !tg.still && !avReduced);
  if (flash > 0) applyFlash(tg.d32, Math.min(0.75, flash * 0.11));
  tg.ctx.putImageData(tg.img, 0, 0);
}
function avTick(ts) {
  var fr = Math.floor(ts / 100);
  if (fr !== avFrame) {
    avFrame = fr;
    if (!avReduced || avFlash > 0) {
      avTargets.forEach(function (tg) { if (!tg.still && document.body.contains(tg.el)) avPaint(tg, fr, tg.id === "main" ? avFlash : 0); });
      if (avFlash > 0) avFlash--;
    }
  }
  requestAnimationFrame(avTick);
}
var mainTarget = null;
function renderAvatar() {
  var tr = tiersOf(cur), o = getAv();
  if (lastTiers && lastTiersWeek === cur && (tr.argent > lastTiers.argent || tr.etude > lastTiers.etude || tr.sport > lastTiers.sport)) avFlash = 8;
  lastTiers = tr; lastTiersWeek = cur;
  $("av-title").textContent = "Avatar de la semaine " + (cur + 1);
  $("av-status").textContent = weekStatus(cur);
  if (!mainTarget) mainTarget = avMake($("av-canvas"), function () { return { o: getAv(), tr: tiersOf(cur) }; }, false, "main");
  avPaint(mainTarget, avFrame, avFlash);
  $("av-badges").innerHTML = '<span class="avbadge">💶 ' + VEHICLES[tr.argent].n + '</span><span class="avbadge">📚 Intelligence ' + tr.etude + '/5</span><span class="avbadge">🏃 Muscles ' + tr.sport + '/5</span>';
}
function openWeeks() {
  var last = realWeekIdx();
  Object.keys(state.weeks).forEach(function (k) { last = Math.max(last, +k); });
  last = Math.max(last, cur);
  openModal(head("Mes semaines") + '<div class="wgrid" id="wg"></div>');
  $("sheet").className = "sheet wide";
  bindClose();
  var grid = $("wg");
  for (var i = 0; i <= last; i++) {
    (function (i) {
      var tr = tiersOf(i), t = totals(i), g = goalsOf(i);
      var a = weekStart(i), b = weekStart(i); b.setDate(b.getDate() + 6);
      var card = mkEl("button", "wcard" + (i === cur ? " sel" : ""));
      card.type = "button";
      var cv = document.createElement("canvas"); cv.width = PW; cv.height = PH; card.appendChild(cv);
      var tg = { el: cv, ctx: cv.getContext("2d"), still: true };
      tg.img = tg.ctx.createImageData(PW, PH); tg.d32 = new Uint32Array(tg.img.data.buffer);
      renderFrame(tg.d32, 2, getAv(), tr, false); tg.ctx.putImageData(tg.img, 0, 0);
      var info = mkEl("div", "wt");
      info.innerHTML = '<b>Semaine ' + (i + 1) + '</b>' + a.getDate() + (a.getMonth() !== b.getMonth() ? " " + MONTHS[a.getMonth()] : "") + " – " + b.getDate() + " " + MONTHS[b.getMonth()] + " · " + weekStatus(i) +
        '<div class="wst">' + VEHICLES[tr.argent].n + '<br>💶 ' + pctOf(t.net, g.argent) + ' % · 📚 ' + pctOf(t.study, g.etude) + ' % · 🏃 ' + pctOf(t.sport, g.sport) + ' %</div>';
      card.appendChild(info);
      card.onclick = function () { cur = i; closeModal(); renderAll(); };
      grid.appendChild(card);
    })(i);
  }
}
function swatches(k, list, cur0) {
  return '<div class="sw-row">' + list.map(function (c) {
    return '<button type="button" class="sw' + (c === cur0 ? " sel" : "") + '" data-k="' + k + '" data-v="' + c + '" style="background:' + c + '" aria-label="Couleur ' + c + '"></button>';
  }).join("") + "</div>";
}
function options(k, list, cur0) {
  return '<div class="sw-row">' + list.map(function (x) {
    return '<button type="button" class="opt' + (x.k === cur0 ? " sel" : "") + '" data-k="' + k + '" data-v="' + x.k + '">' + x.n + "</button>";
  }).join("") + "</div>";
}
function openCustom() {
  var w = getAv(), real = tiersOf(cur), mode = "real";
  openModal(head("Personnaliser mon avatar") +
    '<div class="seg"><button type="button" class="sel" data-m="real">Mon niveau</button><button type="button" data-m="max">Niveau maximum</button></div>' +
    '<div class="avprev"><canvas id="cp-canvas" width="144" height="96"></canvas></div>' +
    '<label>Peau</label>' + swatches("skin", PX_SKINS, w.skin) +
    '<label>Cheveux</label>' + options("hair", PX_HAIRS, w.hair) + '<div style="height:8px"></div>' + swatches("hairColor", PX_HAIR_COLORS, w.hairColor) +
    '<label>Casque (avant l’or)</label>' + swatches("helmet", PX_HELMETS, w.helmet) +
    '<label>Gilet</label>' + swatches("vest", PX_VESTS, w.vest) +
    '<label>Pantalon</label>' + swatches("pants", PX_PANTS, w.pants) +
    '<label>Chaussures</label>' + swatches("shoes", PX_SHOES, w.shoes) +
    '<div class="btns"><button class="btn" id="m-cancel">Annuler</button><button class="btn primary" id="cp-save">Enregistrer</button></div>');
  $("sheet").className = "sheet";
  bindClose();
  var tg = avMake($("cp-canvas"), function () { return { o: w, tr: mode === "max" ? { argent: 5, etude: 5, sport: 5 } : real }; }, false, "prev");
  avPaint(tg, avFrame, 0);
  $("sheet").onclick = function (e) {
    var el = e.target.closest ? e.target.closest("button") : null;
    if (!el) return;
    var m = el.getAttribute("data-m"), k = el.getAttribute("data-k");
    if (m) {
      mode = m;
      Array.prototype.forEach.call($("sheet").querySelectorAll(".seg button"), function (b) { b.classList.toggle("sel", b === el); });
      avPaint(tg, avFrame, 0);
    } else if (k) {
      w[k] = el.getAttribute("data-v");
      Array.prototype.forEach.call($("sheet").querySelectorAll('[data-k="' + k + '"]'), function (b) { b.classList.toggle("sel", b === el); });
      avPaint(tg, avFrame, 0);
    }
  };
  $("cp-save").onclick = function () { state.avatar = w; persist(); closeModal(); renderAll(); };
}
$("av-custom").onclick = openCustom;
$("av-weeks").onclick = openWeeks;
requestAnimationFrame(avTick);

renderAll();
setSync("local");
</script>
</body>
